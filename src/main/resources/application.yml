spring:
  profiles:
    active: local

  application:
    name: tourlk

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=tourlk;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # NOTE: placeholder secret — override in application-local.yml or via env var JWT_SECRET.
    # Must be a Base64-encoded key of sufficient length (>= 256 bits) for HS256.
    secret: ${JWT_SECRET:c2VjcmV0LXBsYWNlaG9sZGVyLWNoYW5nZS1tZS1pbi1sb2NhbC1jb25maWctMjU2Yml0c30=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

stripe:
  # Test-mode keys from dashboard.stripe.com — see frontend/README.md (Payments section)
  # for how to get these and how to run the webhook locally. Never commit real values.
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  level:
    org.hibernate.SQL: debug